name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # lint:check, not lint: the latter runs prettier --write and eslint --fix,
      # so it would pass by rewriting the tree instead of reporting it.
      - name: Lint
        run: bun run lint:check

  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Outer backstop only; the Test step carries its own timeout. This catches a
    # hang in install or build.
    timeout-minutes: 15
    strategy:
      # Windows is the reason this matrix exists: two Windows-only path bugs
      # shipped because CI never ran there. Don't cancel one OS when the other
      # fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (tsc)
        run: bun run build

      - name: Test
        # PI_SKIP_SMOKE: the live-model tests need a pi model endpoint CI has
        # no access to, and `pi` IS on PATH here so their own guard misses it.
        #
        # A STEP timeout under the job's 15-min backstop is deliberate: a JOB
        # timeout cancels every remaining step, so four 2026-07 hangs produced
        # a blank log and no diagnosis.
        timeout-minutes: 10
        run: bun run test
        env:
          PI_SKIP_SMOKE: "1"
          # Makes the bunfig preload print `::test-file <path>` per file, so the
          # last line of a hung log names the file that actually hung. Without
          # it bun only headers files that write output.
          PI_TEST_PROGRESS: "1"

      # Post-test diagnostics for an intermittent hang that has never reproduced
      # locally and has struck both runners. Leading hypothesis: a test spawns a
      # child that outlives it with stdio still piped.
      #
      # always() so they run on the timeout path — the only one that matters.
      # Every command is `|| true`: a false red here beats nothing, but not the
      # flake it chases.
      - name: Diagnose survivors (unix)
        if: always() && runner.os != 'Windows'
        run: |
          echo "::group::full process table"
          ps -eo pid,ppid,pgid,etime,stat,cmd || true
          echo "::endgroup::"

          # Match the basename of argv[0]. /proc/<pid>/comm reads "MainThread"
          # for node, and a substring match over full argv hits "irq/9-acpi".
          filter='NR == 1 { print; next }
                  { n = split($6, p, "/"); exe = p[n]; sub(/\.exe$/, "", exe)
                    if (exe ~ /^(bun|bunx|node|pi|tsc)$/) print }'

          echo "::group::bun / pi / node survivors"
          ps -eo pid,ppid,pgid,etime,stat,args | awk "$filter" || true
          echo "::endgroup::"

          echo "::group::open handles held by survivors"
          if command -v lsof >/dev/null 2>&1; then
            pids="$(ps -eo pid,ppid,pgid,etime,stat,args \
                      | awk "$filter" | awk 'NR > 1 { print $1 }')"
            if [ -n "$pids" ]; then
              for pid in $pids; do
                echo "--- pid $pid ---"
                # -a is load-bearing: lsof ORs its selection flags, so without
                # it this dumps every fd on the box.
                lsof -w -a -p "$pid" -d '^mem,^txt,^rtd,^cwd' 2>/dev/null || true
              done
            else
              echo "(no survivors)"
            fi
          else
            echo "(lsof unavailable)"
          fi
          echo "::endgroup::"

      - name: Diagnose survivors (windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "::group::bun / pi / node survivors"
          try {
            # Anchored: an unanchored 'pi' matches spoolsv, WmiPrvSE and more.
            $procs = Get-CimInstance Win32_Process |
              Where-Object { $_.Name -match '^(bun|bunx|node|pi|tsc)\.exe$' } |
              Select-Object ProcessId, ParentProcessId, CreationDate, Name, CommandLine
            if ($procs) { $procs | Format-List } else { Write-Host "(none)" }
          } catch { Write-Host "(process query failed: $_)" }
          Write-Host "::endgroup::"

          Write-Host "::group::full process table"
          try { Get-Process | Sort-Object CPU -Descending | Format-Table -AutoSize }
          catch { Write-Host "(unavailable)" }
          Write-Host "::endgroup::"

  # The suite above is Bun-only, but `pi` runs the shipped dist/ under NODE —
  # where issue #7 (an EADDRINUSE escaping as an uncaughtException) was
  # reported. Runs the built output under real Node on both OSes, across pi's
  # oldest supported version (engines: node>=22.19.0) and a current line.
  #
  # A regression guard, not a reproduction: runners release ports fast enough
  # that even the buggy code stayed green.
  node-smoke:
    name: node smoke (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v4

      - name: Install bun (build only)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (tsc)
        run: bun run build

      - name: Node smoke (issue #7 bind/retry)
        run: node scripts/node-smoke.mjs
